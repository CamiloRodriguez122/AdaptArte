  <main class="sheet-page">
    <a class="sheet-back" href="products.html">&#8592; Volver a la galería</a>

    <article class="sheet">
      <div class="sheet-photo">
        <img id="sheetImage" alt="">
      </div>

      <div class="sheet-info">
        <h1 class="sheet-title"><em id="sheetName"></em> <span id="sheetSubtitle"></span></h1>
        <p class="sheet-desc" id="sheetDesc"></p>

        <h2 class="sheet-spec-title">Especificación</h2>
        <dl class="sheet-specs">
          <div class="spec-row"><dt>Estilo</dt><dd id="specStyle"></dd></div>
          <div class="spec-row"><dt>Material</dt><dd id="specMaterial"></dd></div>
          <div class="spec-row"><dt>Entrega</dt><dd id="specDelivery"></dd></div>
          <div class="spec-row"><dt>Capacidad de ajuste</dt><dd id="specAdjust"></dd></div>
          <div class="spec-row" id="colorRow"><dt>Color</dt><dd class="swatches" id="swatches"></dd></div>
          <div class="spec-row"><dt>Precio</dt><dd id="specPrice"></dd></div>
        </dl>

        <button class="sheet-add" id="addToCartBtn">Agregar al carrito</button>
