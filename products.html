<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptArqs | Productos</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <!-- 🔝 NAVBAR -->
  <header class="navbar">
    <div class="logo">ADAPTARQS</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="products.html" class="active">Products</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="closing.html">Closing</a></li>
      </ul>
    </nav>
  </header>

  <!-- 🪑 PRODUCTOS -->
  <section class="products">
    <div class="products-container">
      <h2>GALERÍA DE PRODUCTOS</h2>

      <div class="carousel">
        <button class="arrow left" id="prevBtn">&#10094;</button>
        <div class="carousel-track" id="carouselTrack">
        </div>
        <button class="arrow right" id="nextBtn">&#10095;</button>
      </div>
    </div>
  </section>

  <!-- 🔻 FOOTER -->
  <footer class="footer">
    <p>SOLUCIONES DIGITALES Y ESCALABLES <span>04</span></p>
  </footer>

<script src="productos.js"></script>
<script>
  // 🪑 Tarjetas de la galería generadas desde el catálogo
  document.getElementById('carouselTrack').innerHTML = PRODUCTS.map(p => `
          <div class="product-card">
            <img src="${p.image}" alt="${p.name}: ${p.subtitle}" loading="lazy">
            <h3>${p.name}</h3>
            <p class="subtitle">${p.subtitle}</p>
            <p class="price">${formatCOP(p.price)}</p>
            <a href="buy.html?p=${p.id}" class="btn">Comprar</a>
          </div>`).join('');
</script>

<script>
  const track = document.getElementById('carouselTrack');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  let isTransitioning = false;

  function getScrollStep() {
    const card = track.querySelector('.product-card');
    // gap is 14px (mobile) or 25px (desktop). We'll approximate or fetch.
    const gap = window.innerWidth <= 768 ? 14 : 25;
    return card ? card.offsetWidth + gap : 320;
  }

  // Desactivar scroll nativo para usar la animación CSS puramente
  track.style.overflow = 'visible';

  nextBtn.addEventListener('click', () => {
    if (isTransitioning) return;
    isTransitioning = true;
    const step = getScrollStep();
    track.style.transition = 'transform 0.4s ease-in-out';
    track.style.transform = `translateX(-${step}px)`;
    
    setTimeout(() => {
      track.style.transition = 'none';
      track.style.transform = 'translateX(0)';
      track.appendChild(track.firstElementChild);
      isTransitioning = false;
    }, 400);
  });

  prevBtn.addEventListener('click', () => {
    if (isTransitioning) return;
    isTransitioning = true;
    const step = getScrollStep();
    // Move last element to front instantly
    track.prepend(track.lastElementChild);
    // Offset backwards instantly
    track.style.transition = 'none';
    track.style.transform = `translateX(-${step}px)`;
    
    // Force layout recalculation
    void track.offsetWidth;
    
    // Animate to 0
    track.style.transition = 'transform 0.4s ease-in-out';
    track.style.transform = 'translateX(0)';
    
    setTimeout(() => {
      isTransitioning = false;
    }, 400);
  });
</script>

  <script src="script.js"></script>
</body>
</html>
